<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lumen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one centred puzzle board like a lit glass tray, a slim status bar above and controls below. */
:root{
  --bg:#eef1f6; --tray:#ffffff; --cell:#e3e8f0; --wall:#5b6478; --ink:#1d2433; --muted:#667089;
  --beam:#ff4d6d; --glow:#ff4d6d55; --gem:#2f7df6; --gemlit:#ffb020; --mirror:#1d2433;
  --display:"Avenir Next Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --body:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1119; --tray:#151b27; --cell:#1e2636; --wall:#7c87a0; --ink:#e8ecf5; --muted:#8c97ae;
  --beam:#ff5c7a; --glow:#ff5c7a66; --gem:#5b9bff; --gemlit:#ffc040; --mirror:#e8ecf5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1119; --tray:#151b27; --cell:#1e2636; --wall:#7c87a0; --ink:#e8ecf5; --muted:#8c97ae;
  --beam:#ff5c7a; --glow:#ff5c7a66; --gem:#5b9bff; --gemlit:#ffc040; --mirror:#e8ecf5; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px;box-sizing:border-box}
*{box-sizing:border-box}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,8vw,48px);letter-spacing:.38em;margin:0;line-height:1;text-transform:uppercase}
h1 span{color:var(--beam)}
.sub{margin:6px 0 0;color:var(--muted);font-size:13.5px;line-height:1.45;max-width:44ch}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--tray);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums}
.board{position:relative;background:var(--tray);border-radius:18px;padding:10px;box-shadow:0 10px 40px -18px #1d243366}
canvas{display:block;width:100%;aspect-ratio:1/1;max-width:100%;touch-action:manipulation;cursor:pointer;border-radius:10px}
.win{position:absolute;inset:10px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--tray) 78%,transparent);backdrop-filter:blur(2px)}
.win div{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:16px}
.win h2{font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;margin:0;font-size:28px;font-weight:600}
.win p{margin:0;color:var(--muted)}
.controls{display:flex;gap:8px;flex-wrap:wrap}
button{font:500 14px var(--body);color:var(--ink);background:var(--tray);border:1px solid color-mix(in srgb,var(--muted) 35%,transparent);border-radius:999px;padding:10px 16px;min-height:42px;cursor:pointer}
button:hover{border-color:var(--ink)}
button.primary{background:var(--beam);border-color:var(--beam);color:#fff}
button:focus-visible{outline:2px solid var(--gem);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.spacer{flex:1}
.how{color:var(--muted);font-size:13px;line-height:1.55;margin:0}
.how b{color:var(--ink);font-weight:600}
</style>

<div class="app">
  <header>
    <div>
      <h1>Lum<span>e</span>n</h1>
      <p class="sub">Bend one laser with mirrors until every crystal glows.</p>
    </div>
  </header>
  <div class="status">
    <div class="stat"><span class="k">Level</span><span class="v" id="lv">1</span></div>
    <div class="stat"><span class="k">Mirrors left</span><span class="v" id="ml">0</span></div>
    <div class="stat"><span class="k">Crystals</span><span class="v" id="cr">0/0</span></div>
  </div>
  <div class="board">
    <canvas id="cv" aria-label="Puzzle board. Tap a square to place or turn a mirror."></canvas>
    <div class="win" id="win" hidden><div><h2>Lit</h2><p id="winTxt"></p><button class="primary" id="next">Next level</button></div></div>
  </div>
  <div class="controls">
    <button id="prev" aria-label="Previous level">‹</button>
    <button id="nextBtn" aria-label="Next level">›</button>
    <span class="spacer"></span>
    <button id="hint">Hint</button>
    <button id="reset">Clear</button>
  </div>
  <p class="how"><b>Tap</b> an empty square to drop a mirror <b>╱</b>, tap again to flip it <b>╲</b>, once more to remove it. Walls block light. Any route that lights every crystal counts, and boards grow as you climb.</p>
</div>

<script>
"use strict";
const DX=[1,0,-1,0],DY=[0,1,0,-1];
const SLASH={0:3,3:0,2:1,1:2}, BACK={0:1,1:0,2:3,3:2};
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}

function generate(level){
  const S=Math.min(9,5+Math.floor((level-1)/3));
  const want=Math.min(8,2+Math.floor((level-1)/2));
  const nT=Math.min(4,1+Math.floor((level-1)/3));
  const R=rng(level*9973+17);
  for(let attempt=0;attempt<500;attempt++){
    const sy=Math.floor(R()*S);
    let x=-1,y=sy,d=0,turns=0;const seen=new Set(),path=[],mir={};
    let ok=true;
    for(let guard=0;guard<S*S;guard++){
      x+=DX[d];y+=DY[d];
      if(x<0||y<0||x>=S||y>=S)break;
      const key=y*S+x;if(seen.has(key)){ok=false;break;}
      seen.add(key);path.push(key);
      if(turns<want&&R()<0.42){
        const opts=[(d+1)%4,(d+3)%4].filter(nd=>{const nx=x+DX[nd],ny=y+DY[nd];return nx>=0&&ny>=0&&nx<S&&ny<S&&!seen.has(ny*S+nx);});
        if(opts.length){const nd=opts[Math.floor(R()*opts.length)];
          mir[key]=SLASH[d]===nd?"/":"\\";d=nd;turns++;}
      }
    }
    if(!ok||turns<want)continue;
    const firstM=path.findIndex(k=>mir[k]);
    const cand=path.filter((k,i)=>!mir[k]&&i>firstM);
    if(cand.length<nT)continue;
    const targets=new Set();
    // spread crystals along the route after the first bend
    for(let i=0;i<nT;i++)targets.add(cand[Math.min(cand.length-1,Math.floor((i+1)*cand.length/(nT+1)+R()*2))]);
    if(targets.size<nT)continue;
    const walls=new Set();
    for(let k=0;k<S*S;k++)if(!seen.has(k)&&R()<0.16)walls.add(k);
    const lvl={S,sy,mir,targets:[...targets],walls:[...walls],count:turns};
    if(trace(lvl,{}).lit.size>0)continue; // no crystal may sit on the bare beam
    return lvl;
  }
  return null;
}

function trace(L,placed){
  const S=L.S,walls=new Set(L.walls),tg=new Set(L.targets),lit=new Set(),seg=[];
  let x=-1,y=L.sy,d=0;const vis=new Set();
  seg.push([x+0.5,y+0.5]);
  for(let guard=0;guard<4*S*S+4;guard++){
    const nx=x+DX[d],ny=y+DY[d];
    if(nx<0||ny<0||nx>=S||ny>=S){seg.push([nx+0.5-DX[d]*0.5,ny+0.5-DY[d]*0.5]);break;}
    const k=ny*S+nx;x=nx;y=ny;
    if(walls.has(k)){seg.push([x+0.5-DX[d]*0.5,y+0.5-DY[d]*0.5]);break;}
    if(tg.has(k))lit.add(k);
    const sk=k*4+d;if(vis.has(sk)){seg.push([x+0.5,y+0.5]);break;}vis.add(sk);
    const m=placed[k];
    if(m){seg.push([x+0.5,y+0.5]);d=(m==="/"?SLASH:BACK)[d];}
  }
  return {lit,seg};
}

// ---------- state ----------
let level=1,best=1;
try{level=Math.max(1,parseInt(localStorage.getItem("lumen.level")||"1",10)||1);best=Math.max(level,parseInt(localStorage.getItem("lumen.best")||"1",10)||1);}catch(e){}
let L,placed,locked,moves,solved;
function load(n){
  level=n;L=generate(level);placed={};locked=new Set();moves=0;solved=false;
  try{localStorage.setItem("lumen.level",String(level));}catch(e){}
  $("win").hidden=true;update();
}
const $=id=>document.getElementById(id);
const used=()=>Object.keys(placed).length;
function update(){
  const r=trace(L,placed);
  $("lv").textContent=level;$("ml").textContent=L.count-used();
  $("cr").textContent=r.lit.size+"/"+L.targets.length;
  $("prev").disabled=level<=1;$("nextBtn").disabled=level>=best;
  if(!solved&&r.lit.size===L.targets.length){
    solved=true;best=Math.max(best,level+1);
    try{localStorage.setItem("lumen.best",String(best));}catch(e){}
    $("winTxt").textContent=`${L.targets.length} crystal${L.targets.length>1?"s":""} lit with ${used()} mirror${used()===1?"":"s"} in ${moves} move${moves===1?"":"s"}.`;
    setTimeout(()=>{if(solved)$("win").hidden=false;},650);
    litAt=performance.now();
  }
  $("nextBtn").disabled=level>=best;
}

// ---------- drawing ----------
const cv=$("cv"),ctx=cv.getContext("2d");let W=0,dpr=1,litAt=0;
const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let C={};function readTok(){["--tray","--cell","--wall","--ink","--muted","--beam","--glow","--gem","--gemlit","--mirror"].forEach(n=>C[n]=tok(n));}
readTok();matchMedia("(prefers-color-scheme: dark)").addEventListener("change",readTok);
new MutationObserver(readTok).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
function resize(){const b=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=b.width;cv.width=Math.round(W*dpr);cv.height=Math.round(W*dpr);}
new ResizeObserver(resize).observe(cv);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function geom(){const S=L.S,pad=W*0.07,cs=(W-pad*2)/S;return {S,pad,cs};}
function draw(t){
  requestAnimationFrame(draw);if(!W||!L)return;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,W);
  const {S,pad,cs}=geom(),walls=new Set(L.walls),r=trace(L,placed);
  const P=(gx,gy)=>[pad+gx*cs,pad+gy*cs];
  // cells
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const k=y*S+x,[px,py]=P(x,y),g=cs*0.06;
    ctx.fillStyle=walls.has(k)?C["--wall"]:C["--cell"];
    roundRect(px+g,py+g,cs-2*g,cs-2*g,cs*0.14);ctx.fill();
    if(locked.has(k)){ctx.strokeStyle=C["--gem"];ctx.lineWidth=1.5;roundRect(px+g,py+g,cs-2*g,cs-2*g,cs*0.14);ctx.stroke();}
  }
  // emitter
  const [ex,ey]=P(0,L.sy+0.5);
  ctx.fillStyle=C["--ink"];roundRect(ex-pad*0.85,ey-cs*0.22,pad*0.7,cs*0.44,4);ctx.fill();
  ctx.fillStyle=C["--beam"];ctx.beginPath();ctx.arc(ex-pad*0.15,ey,cs*0.08,0,7);ctx.fill();
  // beam
  const pulse=reduce?1:0.75+0.25*Math.sin(t/180);
  const pts=r.seg.map(([gx,gy])=>P(gx,gy));pts[0]=[ex-pad*0.15,ey];
  ctx.lineCap="round";ctx.lineJoin="round";
  ctx.strokeStyle=C["--glow"];ctx.lineWidth=cs*0.28*pulse;polyline(pts);
  ctx.strokeStyle=C["--beam"];ctx.lineWidth=Math.max(2,cs*0.07);polyline(pts);
  ctx.strokeStyle="#ffffffcc";ctx.lineWidth=Math.max(1,cs*0.022);polyline(pts);
  // crystals
  L.targets.forEach(k=>{
    const x=k%S,y=Math.floor(k/S),[cx,cy]=P(x+0.5,y+0.5),on=r.lit.has(k),s=cs*0.26;
    if(on){ctx.fillStyle=C["--gemlit"]+"55";ctx.beginPath();ctx.arc(cx,cy,s*1.9*(reduce?1:0.9+0.15*Math.sin(t/220+k)),0,7);ctx.fill();}
    ctx.beginPath();ctx.moveTo(cx,cy-s);ctx.lineTo(cx+s*0.8,cy);ctx.lineTo(cx,cy+s);ctx.lineTo(cx-s*0.8,cy);ctx.closePath();
    ctx.fillStyle=on?C["--gemlit"]:C["--gem"];ctx.fill();
    ctx.strokeStyle=C["--tray"];ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx-s*0.8,cy);ctx.lineTo(cx+s*0.8,cy);ctx.stroke();
  });
  // mirrors
  for(const ks in placed){
    const k=+ks,x=k%S,y=Math.floor(k/S),[px,py]=P(x,y),m=placed[k],i=cs*0.2;
    ctx.strokeStyle=C["--mirror"];ctx.lineWidth=Math.max(3,cs*0.09);ctx.lineCap="round";
    ctx.beginPath();
    if(m==="/"){ctx.moveTo(px+i,py+cs-i);ctx.lineTo(px+cs-i,py+i);}else{ctx.moveTo(px+i,py+i);ctx.lineTo(px+cs-i,py+cs-i);}
    ctx.stroke();
  }
  // win sweep
  if(solved&&!reduce){const a=Math.max(0,1-(t-litAt)/700);if(a>0){ctx.fillStyle=C["--gemlit"];ctx.globalAlpha=a*0.18;ctx.fillRect(0,0,W,W);ctx.globalAlpha=1;}}
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function polyline(p){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();}

// ---------- input ----------
cv.addEventListener("pointerdown",e=>{
  if(solved)return;
  const b=cv.getBoundingClientRect(),{S,pad,cs}=geom();
  const x=Math.floor((e.clientX-b.left-pad)/cs),y=Math.floor((e.clientY-b.top-pad)/cs);
  if(x<0||y<0||x>=S||y>=S)return;
  const k=y*S+x;
  if(L.walls.includes(k)||L.targets.includes(k)||locked.has(k))return;
  const m=placed[k];
  if(!m){if(used()>=L.count)return;placed[k]="/";}
  else if(m==="/")placed[k]="\\";
  else delete placed[k];
  moves++;update();
});
$("reset").onclick=()=>{for(const k in placed)if(!locked.has(+k))delete placed[k];solved=false;$("win").hidden=true;update();};
$("hint").onclick=()=>{
  if(solved)return;
  const keys=Object.keys(L.mir).map(Number).filter(k=>placed[k]!==L.mir[k]||!locked.has(k));
  const k=keys.find(k=>!locked.has(k));if(k===undefined)return;
  if(placed[k]===undefined&&used()>=L.count){const free=Object.keys(placed).map(Number).find(q=>!locked.has(q)&&L.mir[q]===undefined);if(free!==undefined)delete placed[free];}
  placed[k]=L.mir[k];locked.add(k);moves++;update();
};
$("next").onclick=()=>load(level+1);
$("nextBtn").onclick=()=>load(level+1);
$("prev").onclick=()=>load(Math.max(1,level-1));
load(level);resize();requestAnimationFrame(draw);
</script>

</body></html>
